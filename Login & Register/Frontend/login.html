<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Pennywise Expense Tracker</title>
  <meta name="description" content="Log in to your Pennywise account to continue managing your finances and tracking expenses.">
  
  <!-- Favicon / Brand Icon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/pennywise-logo.svg">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">

  <main class="auth-container">
    <!-- Left Column: Large Blue Wallet Illustration with Green Leaves & Gold Coins -->
    <section class="auth-illustration-pane" aria-label="Pennywise Financial Illustration">
      <img 
        src="assets/images/wallet-illustration.svg" 
        alt="Illustration of a blue wallet with gold coins and blooming green leaves representing financial growth" 
        class="illustration-img"
        width="520"
        height="520"
      >
    </section>

    <!-- Right Column: Authentication Card -->
    <section class="auth-card-pane">
      <div class="auth-card">
        
        <!-- Pennywise Branding -->
        <header class="brand-header">
          <a href="login.html" aria-label="Pennywise Home">
            <img src="assets/images/pennywise-logo.svg" alt="Pennywise Logo" width="160" height="38">
          </a>
        </header>

        <!-- Centered Headings -->
        <div class="auth-header">
          <h1 class="auth-title">Welcome back!</h1>
          <p class="auth-subtitle">Log in to your account to continue managing your finances.</p>
        </div>

        <!-- Server / Validation Feedback Banner -->
        <div id="alert-banner" class="alert-banner" role="alert" aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="alert-text"></span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form" novalidate>
          
          <!-- Email Address Input -->
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-input" 
                placeholder="name@example.com" 
                autocomplete="email" 
                required 
                aria-describedby="email-error"
              >
            </div>
            <span id="email-error" class="field-error" role="alert"></span>
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input" 
                placeholder="Enter your password" 
                autocomplete="current-password" 
                required 
                aria-describedby="password-error"
              >
              <button 
                type="button" 
                id="pwd-toggle-btn" 
                class="pwd-toggle-btn" 
                aria-label="Show password"
              >
                <span id="pwd-toggle-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </span>
              </button>
            </div>
            <span id="password-error" class="field-error" role="alert"></span>
          </div>

          <!-- Remember Me Checkbox -->
          <div class="login-options-row">
            <label class="form-checkbox-group custom-checkbox">
              <input type="checkbox" id="remember-me" name="rememberMe">
              <span class="checkbox-box" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
              <span class="checkbox-label">Remember Me</span>
            </label>
          </div>

          <!-- Full-Width Green Login Button -->
          <button type="submit" id="submit-btn" class="btn-primary">
            <span class="btn-text">Log In</span>
            <div class="spinner" aria-hidden="true"></div>
          </button>
        </form>

        <!-- Footer Navigation -->
        <footer class="auth-footer">
          Don't have an account? <a href="register.html">Sign Up</a>
        </footer>

      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
